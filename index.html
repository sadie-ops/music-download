<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MP3 Juices - Music Search</title>

<link rel="stylesheet" href="style.css">

</head><body><header>
    <div class="logo">🎵 MP3 Juices</div>
</header><main><section class="hero">

    <h1>Music Search</h1>

    <p>
        Search millions of songs online.
    </p>

    <div class="search-box">

        <input
            id="search"
            type="text"
            placeholder="Search for a song or artist..."
        >

        <button id="searchButton">
            🔍 Search
        </button>

    </div>

</section>


<section class="results">

    <h2>Search Results</h2>

    <div id="results">
        <p class="message">
            Type a song name to search.
        </p>
    </div>

</section>

</main><footer>
    <p>© 2026 Music Search</p>
</footer><script src="script.js"></script></body>
</html>
